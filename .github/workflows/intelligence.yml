name: Refresh global intelligence snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "sentinel/intelligence_pipeline.py"
      - "sentinel/extra_feeds.py"
      - "sentinel/test_extra_feeds.py"
      - ".github/workflows/intelligence.yml"

permissions:
  contents: write

concurrency:
  group: nexus-intelligence-refresh
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies for full unittest discovery
        run: python3 -m pip install -r sentinel/requirements.txt
      - name: Run parser regression tests before collecting
        run: PYTHONPATH=.:sentinel python3 -m unittest discover -s sentinel -p "test_*.py" -v
      - name: Collect licensed public threat intelligence
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python3 sentinel/intelligence_pipeline.py
      - name: Validate snapshot
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("data/overview.json"))
          assert d["schema"] == 2
          assert d["indicators"].get("unique_indicators") is not None
          extra=json.load(open("data/extra.json"))
          assert extra["schema"] == 1
          assert len(extra["source_health"]) == 4
          assert len(json.dumps(extra)) < 2_000_000
          print("Country rows:",len(d["indicators"].get("countries",[])))
          print("Indicator rows:",d["indicators"].get("unique_indicators"))
          PY
      - name: Commit generated data only if changed
        run: |
          git config user.name "nexus-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overview.json data/extra.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh attributed multi-source cyber intelligence snapshot"
            git push
          else
            echo "No data update"
          fi
