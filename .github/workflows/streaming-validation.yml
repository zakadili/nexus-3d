name: Streaming backend validation
on:
  push:
    paths:
      - 'streaming/**'
      - 'stream-adapter.js'
      - 'live-loader.js'
      - 'stream-adapter.css'
      - 'stream-config.js'
      - 'live-signals.js'
      - 'live-signals-core.mjs'
      - 'live-signals.css'
      - 'tests/live-signals.test.mjs'
      - 'index.html'
      - '.github/workflows/streaming-validation.yml'
  pull_request:
    paths:
      - 'streaming/**'
      - 'stream-adapter.js'
      - 'live-loader.js'
      - 'stream-adapter.css'
      - 'stream-config.js'
      - 'live-signals.js'
      - 'live-signals-core.mjs'
      - 'live-signals.css'
      - 'tests/live-signals.test.mjs'
      - 'index.html'
      - '.github/workflows/streaming-validation.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python
        run: python -m py_compile streaming/*.py
      - name: Test bounded live collectors and API without external feeds
        run: |
          python -m pip install -r streaming/requirements.txt
          python -m unittest discover -s streaming -p 'test_live*.py' -v
      - name: Check Javascript syntax
        run: |
          node --check stream-adapter.js
          node --check stream-config.js
          node --check live-loader.js
          node --check live-signals.js
          node --check live-signals-core.mjs
          node --test tests/live-signals.test.mjs
      - name: Check homepage integration
        run: |
          grep -q 'live-loader.js' index.html
          grep -q 'stream-adapter.js' live-loader.js
          grep -q 'stream-adapter.css' index.html
          grep -q 'live-signals.css' index.html
          grep -q 'live-signals.js' live-loader.js
          grep -q 'id="live-signals-content"' index.html
          grep -q 'id="live-intelligence"' index.html
      - name: Check Compose configuration
        env:
          POSTGRES_PASSWORD: ci_not_real
        run: |
          cp streaming/.env.example streaming/.env
          docker compose -f streaming/docker-compose.yml --project-directory streaming config --quiet
      - name: Validate public reverse-proxy configuration
        run: |
          docker run --rm -v "$PWD/streaming/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null
      - name: Test database durability, replay, limits and WebSockets
        working-directory: streaming
        env:
          POSTGRES_PASSWORD: ci_not_real
        run: |
          docker compose up -d --build --wait
          docker compose exec -T api python test_integration.py
      - name: Stop test services
        if: always()
        working-directory: streaming
        env:
          POSTGRES_PASSWORD: ci_not_real
        run: docker compose down

