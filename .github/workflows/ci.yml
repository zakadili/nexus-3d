name: NEXUS quality checks

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: pip install -r sentinel/requirements.txt
      - name: Python syntax
        run: python -m compileall -q sentinel scanner
      - name: Unit tests
        run: PYTHONPATH=.:sentinel python -m unittest discover -s sentinel -p 'test_*.py' -v

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check radar.js
          node --check radar-plus.js
          node --check radar-extras.js
          node --check app.js
          node --check sentinel.js
